# Atton AI Multi-LLM Review Pipeline
# Reusable workflow that runs independent automated reviews on every PR
# (Claude by default) and posts a consensus comment. Gemini job is wired but
# disabled — re-enable in `models` input once the GEMINI secret is set.
#
# Usage from a consuming repo (e.g., atton-finance-landing):
#
#   # .github/workflows/security-review.yml
#   name: AI Security Review
#   on: [pull_request]
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     ai-review:
#       uses: atton-holding/.github/.github/workflows/ai-security-review.yml@main
#       secrets: inherit
#
# Required org-level secrets:
#   - ATTON_CI_GITHUB_ACTIONS_CLAUDE_PROD  (created as `atton-ci-github-actions-claude-prod`)
#
# Optional (Sprint 2 / not yet provisioned):
#   - ATTON_CI_GITHUB_ACTIONS_GEMINI_PROD  (created as `atton-ci-github-actions-gemini-prod`)
#     When set + `models` input includes "gemini", the Gemini job activates.
#
# Security note: PR-controlled values (title/body/branch refs) are passed via
# `with:` to composite actions, which consume them through `inputs.*` and
# bind to env vars before any shell interpolation. No untrusted github.event.*
# field is interpolated directly into a `run:` block.

name: AI Multi-LLM Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review. Defaults to the triggering PR."
        required: false
        type: string
        default: ""
      models:
        description: "Comma-separated provider override. Empty = claude (default). To opt-in Gemini once its secret is provisioned: 'claude,gemini'."
        required: false
        type: string
        default: ""
      diff_max_bytes:
        description: "Maximum diff size in bytes (truncated past this). Token-budget cap."
        required: false
        type: string
        default: "100000"
      base_ref:
        description: "Base ref for diff. Defaults to PR base or origin/main."
        required: false
        type: string
        default: ""
    secrets:
      ATTON_CI_GITHUB_ACTIONS_CLAUDE_PROD:
        required: false
      ATTON_CI_GITHUB_ACTIONS_GEMINI_PROD:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---- Provider review jobs (parallel, independent) ----
  claude-review:
    name: Claude security review
    if: ${{ inputs.models == '' || contains(inputs.models, 'claude') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Claude review
        uses: atton-holding/.github/.github/actions/llm-review@main
        with:
          provider: claude
          focus: security
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          base_ref: ${{ inputs.base_ref || github.event.pull_request.base.ref || 'main' }}
          diff_max_bytes: ${{ inputs.diff_max_bytes }}
          api_key: ${{ secrets.ATTON_CI_GITHUB_ACTIONS_CLAUDE_PROD }}

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-claude
          path: findings-claude.json
          if-no-files-found: ignore
          retention-days: 7

  # Gemini reviewer — opt-in via `models: 'claude,gemini'` once
  # ATTON_CI_GITHUB_ACTIONS_GEMINI_PROD secret is provisioned (Sprint 2).
  # The default `models == ''` runs only Claude.
  gemini-review:
    name: Gemini data-flow review
    if: ${{ contains(inputs.models, 'gemini') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Gemini review
        uses: atton-holding/.github/.github/actions/llm-review@main
        with:
          provider: gemini
          focus: dataflow
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          base_ref: ${{ inputs.base_ref || github.event.pull_request.base.ref || 'main' }}
          diff_max_bytes: ${{ inputs.diff_max_bytes }}
          api_key: ${{ secrets.ATTON_CI_GITHUB_ACTIONS_GEMINI_PROD }}

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-gemini
          path: findings-gemini.json
          if-no-files-found: ignore
          retention-days: 7

  # ---- Retired-provider ratchet (CASE-294 · provider-retirement-checklist.md) ----
  # Diff-only gate: fails the PR if an ADDED line reintroduces a retired
  # provider. Matches functional patterns only (endpoints, env vars, model
  # ids, function names) — historical-record lines preserved ecosystem-wide
  # never match these. Escape hatch for moving/quoting historical text: put
  # the marker "(histórico)" or "no reintroducir" on the line.
  # Retired: Kimi/Moonshot (2026-07-02 · account closed · no HIPAA BAA · TASK-0525).
  retired-provider-ratchet:
    name: Retired-provider ratchet
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fail if the diff reintroduces a retired provider
        run: |
          set -euo pipefail
          # Functional patterns per retired provider (extend on future retirements):
          PATTERN='api\.moonshot|moonshot\.(ai|cn)|kimi-k[0-9]|KIMI_API_KEY|KIMI_MODEL|MOONSHOT_API_KEY|MOONSHOT_MODEL|MOONSHOT_ENDPOINT|callMoonshot'
          ESCAPE='hist[oó]rico|no reintroducir|RETIRED-OK'
          # On pull_request the checkout is the merge commit: HEAD^1 = base tip,
          # so this diff is exactly what the PR would merge.
          hits=$(git diff HEAD^1 HEAD --unified=0 -- . \
            | grep -E '^\+[^+]' \
            | grep -iE "$PATTERN" \
            | grep -ivE "$ESCAPE" || true)
          if [ -n "$hits" ]; then
            echo "::error::Retired provider reintroduced — Kimi/Moonshot was removed 2026-07-02 (account closed, no HIPAA BAA). Do not reintroduce."
            echo "Offending added lines:"
            echo "$hits"
            echo ""
            echo "If this is historical-record text being moved or quoted, add the"
            echo "marker '(histórico)' or 'no reintroducir' on the same line."
            echo "Canon: aduana/_canonical-rules/provider-retirement-checklist.md (CASE-294)."
            exit 1
          fi
          echo "OK — no retired-provider patterns in added lines."

  # ---- Aggregator: posts a single PR comment ----
  aggregate:
    name: Aggregate reviews and comment
    needs: [claude-review, gemini-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout aggregator action
        uses: actions/checkout@v4
        with:
          repository: atton-holding/.github
          ref: main
          path: _atton_github

      - name: Download all finding artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Aggregate and post PR comment
        uses: ./_atton_github/.github/actions/aggregate-reviews
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          artifacts_dir: artifacts
          repository: ${{ github.repository }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
